model_list:
  - model_name: openAI/together_ai/mistralai/Mixtral-8x7B-Instruct-v0.1
    litellm_params:
      model: together_ai/mistralai/Mixtral-8x7B-Instruct-v0.1
      api_key: os.environ/TOGETHER_API_KEY
      rpm: 3
      timeout: 30
      stream_timeout: 30
      temperature: 0.7
      max_tokens: 3000
      top_p: 0.9
      owned_by: openAI
    model_info:
      supports_vision: false
      supports_audio: false
      supports_file: false
      capabilities: ["text", "chat", "stream"]
  - model_name: deepseek/deepseek/deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: sk-354c3ec4f73542f681d15f2369d9fa95
    model_info:
      supports_vision: false
      supports_audio: false
      supports_file: false
      capabilities: ["text", "chat", "function-calling"]
  - model_name: deepseek/deepseek/deepseek-code
    litellm_params:
      model: deepseek/deepseek-code-test
      api_key: sk-354c3ec4f73542f681d15f2369d9fa95
    model_info:
      supports_vision: false
      supports_audio: false
      supports_file: true
      capabilities: ["text", "chat", "code-completion", "code-generation"]
  - model_name: gemini-pro-vision/gemini/gemini-pro-vision
    litellm_params:
      model: gemini/gemini-pro-vision
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      supports_vision: true
      supports_audio: true
      supports_file: true
      capabilities: ["text", "chat", "vision", "audio", "file", "stream"]
  - model_name: openrouter-vision/openai/anthropic/claude-3-opus-20240229
    litellm_params:
      model: openai/anthropic/claude-3-opus-20240229
      api_base: "https://openrouter.ai/api/v1"
      api_key: os.environ/OPENROUTER_API_KEY
      max_tokens: 100
      temperature: 0.7
      stream: true
      headers: {
        "HTTP-Referer": "https://litellm.ai",
        "X-Title": "LiteLLM Server"
      }
    model_info:
      supports_vision: true
      supports_file: true
      capabilities: ["text", "chat", "vision", "file", "stream"]
  - model_name: glm-4v-vision/openai/glm-4v
    litellm_params:
      model: openai/glm-4v
      api_key: os.environ/ZHIPU_API_KEY
      api_base: "https://open.bigmodel.cn/api/paas/v4"
    model_info:
      supports_vision: true
      supports_file: true
      capabilities: ["text", "chat", "vision", "file", "stream"]

litellm_settings:
  drop_params: True
  num_retries: 2
  request_timeout: 30
  telemetry: False
  default_headers:
    "Content-Type": "application/json"

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: false
  retry_on_failure: true
  timeout: 30

general_settings:
  master_key: sk-1234joyoful
  store_model_in_db: True
  fallback_strategy: "retry"
  disable_adding_master_key_hash_to_db: false
