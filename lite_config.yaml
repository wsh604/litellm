model_list:
  - model_name: openAI/together_ai/mistralai/Mixtral-8x7B-Instruct-v0.1
    litellm_params:
      model: together_ai/mistralai/Mixtral-8x7B-Instruct-v0.1
      api_key: os.environ/TOGETHER_API_KEY
      rpm: 3
      timeout: 30
      stream_timeout: 30
      temperature: 0.7
      max_tokens: 3000
      top_p: 0.9
      owned_by: openAI
      capabilities: ["text"]
  - model_name: deepseek/deepseek/deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: sk-354c3ec4f73542f681d15f2369d9fa95
      capabilities: ["text"]
  - model_name: deepseek/deepseek/deepseek-code
    litellm_params:
      model: deepseek/deepseek-code-test
      api_key: sk-354c3ec4f73542f681d15f2369d9fa95
      capabilities: ["text"]
litellm_settings:
  drop_params: True
  num_retries: 5
  request_timeout: 30
  telemetry: False
  default_headers:
    "Content-Type": "application/json"

router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: false
  retry_on_failure: true
  timeout: 30

general_settings:
  master_key: sk-1234
  store_model_in_db: True
  fallback_strategy: "retry"
  disable_adding_master_key_hash_to_db: false
